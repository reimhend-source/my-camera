<!DOCTYPE html>
<html>
<head>
    <title>Camera Node</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: sans-serif; text-align: center; padding-top: 50px; }
        #status { font-size: 1.2em; color: yellow; }
        video { width: 1px; height: 1px; opacity: 0; } /* Повна непомітність */
    </style>
</head>
<body>
    <div id="status">Запуск системи...</div>
    <h2 id="display-id">ID: Очікування...</h2>
    <video id="localVideo" autoplay playsinline muted></video>

    <script>
        // Використовуємо STUN-сервери Google для проходу через мережеві екрани
        const peer = new Peer('my-private-camera-2026', {
            config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }, { 'urls': 'stun:stun1.l.google.com:19302' }]}
        });

        const status = document.getElementById('status');
        const videoElement = document.getElementById('localVideo');

        peer.on('open', (id) => {
            status.innerText = "Система онлайн. Очікування глядача...";
            document.getElementById('display-id').innerText = "ID: " + id;
        });

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
            .then((stream) => {
                videoElement.srcObject = stream;
                peer.on('call', (call) => {
                    status.innerText = "Трансляція активна!";
                    call.answer(stream);
                });
            })
            .catch(err => status.innerText = "Помилка камери: " + err.message);

        peer.on('error', (err) => status.innerText = "Помилка зв'язку: " + err.type);
    </script>
</body>
</html>
