<!DOCTYPE html>
<html>
<head>
    <title>Viewer Node</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; }
        video { width: 90%; max-width: 640px; border: 2px solid #0f0; margin-top: 20px; background: #000; }
        button { padding: 20px; font-size: 20px; background: #0f0; border: none; cursor: pointer; margin: 10px; }
    </style>
</head>
<body>
    <h2>Панель спостереження</h2>
    <button onclick="startView()">УВІМКНУТИ КАМЕРУ</button>
    <div id="log" style="color: #888;"></div>
    <video id="remoteVideo" autoplay playsinline muted></video>
    <p><i>Якщо відео з'явилося без звуку, натисніть "Увімкнути звук"</i></p>
    <button onclick="document.getElementById('remoteVideo').muted = false" style="background: gray; font-size: 14px;">Увімкнути звук</button>

    <script>
        const peer = new Peer({
            config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]}
        });
        const log = document.getElementById('log');

        function startView() {
            log.innerText = "З'єднуюсь...";
            const call = peer.call('my-private-camera-2026', new MediaStream());
            
            call.on('stream', (remoteStream) => {
                log.innerText = "Стрім отримано!";
                const vid = document.getElementById('remoteVideo');
                vid.srcObject = remoteStream;
                vid.play(); // Примусовий запуск
            });
        }
    </script>
</body>
</html>
