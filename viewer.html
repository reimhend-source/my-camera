<!DOCTYPE html>
<html>
<head>
    <title>Viewer Node</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; }
        video { width: 100%; max-width: 800px; border: 2px solid #0f0; margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #0f0; border: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Панель спостереження</h2>
    <button onclick="connect()">Підключитися до камери</button>
    <div id="info" style="margin-top: 10px; color: #888;"></div>
    <video id="remoteVideo" autoplay playsinline></video>

    <script>
        const peer = new Peer({
            config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]}
        });
        const info = document.getElementById('info');

        function connect() {
            info.innerText = "Спроба підключення...";
            // Викликаємо камеру за фіксованим ID
            const call = peer.call('my-private-camera-2026', new MediaStream());
            
            call.on('stream', (remoteStream) => {
                info.innerText = "З'єднання встановлено!";
                document.getElementById('remoteVideo').srcObject = remoteStream;
            });

            call.on('error', (err) => info.innerText = "Помилка: " + err);
            
            // Якщо через 5 секунд немає стріму, ймовірно, камера офлайн
            setTimeout(() => {
                if (!document.getElementById('remoteVideo').srcObject) {
                    info.innerText = "Камера не відповідає. Перевірте, чи відкрита сторінка на смартфоні.";
                }
            }, 5000);
        }
    </script>
</body>
</html>
