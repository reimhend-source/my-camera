<!DOCTYPE html>
<html>
<head>
    <title>Viewer Node</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; }
        video { width: 90%; border: 2px solid #0f0; margin-top: 20px; background: #000; }
        input { padding: 10px; width: 200px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; cursor: pointer; background: #0f0; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Remote Monitor</h2>
    <input type="text" id="remote-id" placeholder="Введіть ID камери">
    <button onclick="connectToCamera()">Дивитись</button>
    <br>
    <video id="remoteVideo" autoplay playsinline></video>

    <script>
        const peer = new Peer();
        const videoElement = document.getElementById('remoteVideo');

        function connectToCamera() {
            const remoteId = document.getElementById('remote-id').value;
            // Телефонуємо на пристрій-камеру. 
            // Ми маємо передати пустий потік або запит, щоб отримати відповідь
            const call = peer.call(remoteId, new MediaStream()); 
            
            call.on('stream', (remoteStream) => {
                videoElement.srcObject = remoteStream;
            });
        }
    </script>
</body>
</html>
