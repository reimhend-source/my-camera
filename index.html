<!DOCTYPE html>
<html>
<head>
    <title>Camera Node</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; word-break: break-all; }
        #status { color: yellow; }
        video { width: 100%; max-width: 300px; margin-top: 20px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h2>System Status</h2>
    <div id="status">Ініціалізація...</div>
    <hr>
    <div>Мій ID: <h1 id="my-id" style="color: white;">Очікування...</h1></div>
    <video id="localVideo" autoplay playsinline muted></video>

    <script>
        const statusDiv = document.getElementById('status');
        const idDisplay = document.getElementById('my-id');
        const videoElement = document.getElementById('localVideo');

        // 1. Перевірка PeerJS
        const peer = new Peer();

        peer.on('open', (id) => {
            statusDiv.innerText = "З'єднання з сервером встановлено!";
            idDisplay.innerText = id;
            console.log('My ID is: ' + id);
        });

        peer.on('error', (err) => {
            statusDiv.innerText = "Помилка PeerJS: " + err.type;
            console.error(err);
        });

        // 2. Запит камери
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
            .then((stream) => {
                statusDiv.innerText += "\nКамера активована.";
                videoElement.srcObject = stream;
                
                peer.on('call', (call) => {
                    statusDiv.innerText = "Йде трансляція...";
                    call.answer(stream);
                });
            })
            .catch(err => {
                statusDiv.innerText = "ПОМИЛКА КАМЕРИ: " + err.message;
                alert("Будь ласка, дозвольте доступ до камери у налаштуваннях браузера!");
            });
    </script>
</body>
</html>
