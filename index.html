<!DOCTYPE html>
<html>
<head>
    <title>Camera Node</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: sans-serif; text-align: center; padding-top: 50px; }
        video { width: 100px; height: 100px; opacity: 0.1; } /* Ледь помітне прев'ю для контролю */
    </style>
</head>
<body>
    <div id="status" style="color: yellow;">Ініціалізація...</div>
    <video id="localVideo" autoplay playsinline muted></video>

    <script>
        const peer = new Peer('my-private-camera-2026', {
            config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]}
        });

        const status = document.getElementById('status');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then((stream) => {
                document.getElementById('localVideo').srcObject = stream;
                status.innerText = "Камера готова. Очікування...";

                peer.on('call', (call) => {
                    status.innerText = "Трансляція йде!";
                    call.answer(stream);
                });
            })
            .catch(err => status.innerText = "Помилка: " + err.message);

        peer.on('open', () => status.innerText = "Система онлайн. Чекаю глядача...");
        peer.on('error', (err) => status.innerText = "Помилка зв'язку: " + err.type);
    </script>
</body>
</html>
